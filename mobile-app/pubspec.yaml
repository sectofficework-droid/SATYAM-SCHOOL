name: satyam_school
description: Satyam Stars International School — Teacher & Student App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  get: ^4.6.6

  # Supabase
  supabase_flutter: ^2.5.6

  # UI
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  confetti: ^0.7.0

  # Utils
  intl: ^0.19.0
  scrollable_positioned_list: ^0.3.8
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2

  # PDF generation (exam paper / assignment)
  pdf: ^3.11.1
  printing: ^5.13.1

  # Face-scan staff attendance (on-device: detection via ML Kit, identity
  # match via a bundled MobileFaceNet TFLite model)
  camera: ^0.12.0+2
  google_mlkit_face_detection: ^0.14.0
  tflite_flutter: ^0.12.1
  image: ^4.9.1
  file_picker: ^11.0.3
  archive: ^4.0.9
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/models/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/school_logo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/school_logo.jpg"
  remove_alpha_ios: true
